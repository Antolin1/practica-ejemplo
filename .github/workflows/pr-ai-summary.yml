name: Resumen de PR con IA

on:
  pull_request:
    types: [opened]

# Requiere el secreto de repo OLLAMA_API_KEY (Settings > Secrets and variables > Actions)
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-ai-summary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Obtener diff del PR
        id: diff
        run: |
          git diff "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > pr.diff
          # Se trunca para no exceder el contexto del modelo en PRs muy grandes
          head -c 60000 pr.diff > pr.diff.trimmed
          if [ ! -s pr.diff.trimmed ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pedir resumen a Ollama Cloud
        if: steps.diff.outputs.empty == 'false'
        id: ollama
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          BODY=$(jq -n \
            --rawfile diff pr.diff.trimmed \
            --arg model "nemotron-3-ultra:cloud" \
            '{
              model: $model,
              stream: false,
              messages: [
                {
                  role: "system",
                  content: "Eres un asistente que revisa Pull Requests. Recibes un diff en formato git y debes responder en español, en markdown, con: 1) un resumen breve de qué cambia y por qué (si es evidente), 2) una lista de los cambios principales por archivo, 3) riesgos o puntos a revisar si los hay. Se conciso y no inventes cambios que no estén en el diff."
                },
                {
                  role: "user",
                  content: ("Resume el siguiente diff de un Pull Request:\n\n" + $diff)
                }
              ]
            }')

          RESPONSE=$(curl -sS https://ollama.com/api/chat \
            -H "Authorization: Bearer $OLLAMA_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$BODY")

          SUMMARY=$(echo "$RESPONSE" | jq -r '.message.content // empty')

          if [ -z "$SUMMARY" ]; then
            echo "Error al obtener el resumen de Ollama Cloud:" >&2
            echo "$RESPONSE" >&2
            SUMMARY="No se ha podido generar el resumen automático (error al llamar a Ollama Cloud)."
          fi

          {
            echo "summary<<PR_SUMMARY_EOF"
            echo "$SUMMARY"
            echo "PR_SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comentar en el PR
        if: steps.diff.outputs.empty == 'false'
        uses: actions/github-script@v7
        env:
          SUMMARY: ${{ steps.ollama.outputs.summary }}
        with:
          script: |
            const summary = process.env.SUMMARY || "No se ha podido generar el resumen automático.";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### 🤖 Resumen automático del PR (Ollama Cloud)\n\n${summary}`,
            });
